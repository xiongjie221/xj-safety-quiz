<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息安规 · 模拟测试与刷题练习</title>
<style>
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --success: #34a853;
  --danger: #ea4335;
  --warning: #fbbc04;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #1a73e8, #4285f4);
  color: white;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(26,115,232,0.3);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 2px; }
.home { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
.home-title { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.home-desc { text-align: center; color: var(--text-secondary); margin-bottom: 40px; font-size: 15px; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
@media (max-width: 768px) { .mode-grid { grid-template-columns: 1fr; } }
.mode-card {
  background: var(--card); border-radius: 16px; padding: 28px 20px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent; text-align: center;
}
.mode-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-color: var(--primary); }
.mode-card .icon { font-size: 44px; margin-bottom: 12px; }
.mode-card h2 { font-size: 20px; margin-bottom: 8px; }
.mode-card p { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
.mode-card .badge-count {
  display: inline-block; background: var(--danger); color: white;
  border-radius: 12px; padding: 2px 10px; font-size: 13px; font-weight: 700; margin-top: 8px;
}
.mode-card .badge-count.hidden { display: none; }
.stats-bar { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.stat-item { background: var(--card); border-radius: 12px; padding: 16px 24px; box-shadow: var(--shadow); text-align: center; min-width: 110px; }
.stat-item .num { font-size: 28px; font-weight: 800; color: var(--primary); }
.stat-item .label { font-size: 13px; color: var(--text-secondary); }
.exam-header {
  background: var(--card); padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 90;
}
.exam-progress { font-size: 15px; font-weight: 600; }
.exam-timer { font-size: 18px; font-weight: 700; color: var(--danger); font-variant-numeric: tabular-nums; }
.exam-timer.normal { color: var(--text); }
.question-container { max-width: 800px; margin: 0 auto; padding: 24px 20px 80px; }
.question-card { background: var(--card); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.question-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.q-num {
  background: var(--primary); color: white; border-radius: 50%;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
}
.q-type-tag { padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.badge-single { background: #e8f0fe; color: #1a73e8; }
.badge-multi { background: #fef7e0; color: #b06000; }
.badge-judge { background: #e6f4ea; color: #137333; }
.q-stem { font-size: 17px; line-height: 1.8; margin-bottom: 24px; }
.q-stem .blank { color: var(--primary); font-weight: 700; }
.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-item {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
  border: 2px solid var(--border); border-radius: 12px; cursor: pointer;
  transition: all 0.15s; font-size: 15px; line-height: 1.6;
}
.option-item:hover { border-color: var(--primary); background: #f8faff; }
.option-item.selected { border-color: var(--primary); background: #e8f0fe; }
.option-item.correct { border-color: var(--success); background: #e6f4ea; }
.option-item.wrong { border-color: var(--danger); background: #fce8e6; }
.option-label {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0; background: #f1f3f4; color: var(--text);
}
.option-item.selected .option-label { background: var(--primary); color: white; }
.option-item.correct .option-label { background: var(--success); color: white; }
.option-item.wrong .option-label { background: var(--danger); color: white; }
.multi-hint { font-size: 13px; color: #b06000; background: #fef7e0; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; }
.judge-btns { display: flex; gap: 16px; }
.judge-btn {
  flex: 1; padding: 20px; border: 2px solid var(--border); border-radius: 12px;
  text-align: center; font-size: 18px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; background: var(--card);
}
.judge-btn:hover { border-color: var(--primary); }
.judge-btn.selected.correct { border-color: var(--success); background: #e6f4ea; color: var(--success); }
.judge-btn.selected.wrong { border-color: var(--danger); background: #fce8e6; color: var(--danger); }
.judge-btn.reveal-correct { border-color: var(--success); background: #e6f4ea; }
.answer-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 96;
  background: #f8faff; border-top: 2px solid #d0e3fd;
  padding: 14px 20px; max-height: 45vh; overflow-y: auto;
  animation: slideUp 0.3s ease; box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.answer-panel .answer-row { margin-bottom: 8px; font-size: 14px; }
.answer-panel .judge-result { font-size: 17px; padding: 4px 0; margin-bottom: 8px; }
.answer-panel .answer-value.explanation-detail { font-size: 14px; line-height: 1.6; }
.answer-panel .answer-value.mnemonic { font-size: 14px; padding: 6px 10px; }
.question-card { padding: 20px 20px; }
.q-stem { font-size: 16px; margin-bottom: 16px; line-height: 1.7; }
.option-item { padding: 10px 14px; font-size: 14px; }
.judge-btn { padding: 16px; font-size: 16px; }
.question-container { padding: 16px 20px 50vh; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.answer-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; font-size: 15px; }
.answer-row:last-child { margin-bottom: 0; }
.answer-label { font-weight: 700; color: var(--primary); white-space: nowrap; flex-shrink: 0; }
.answer-value { color: var(--text); }
.answer-value.mnemonic {
  background: linear-gradient(135deg, #fff8e1, #fff3c4); padding: 8px 14px;
  border-radius: 8px; border: 1px solid #fde293; font-weight: 600; color: #8b6914;
}
.answer-value.correct-answer { color: var(--success); font-weight: 700; }
.answer-value.explanation-detail { color: var(--text); line-height: 1.8; }
.judge-result { font-size: 20px; font-weight: 800; text-align: center; padding: 8px 0; border-radius: 8px; margin-bottom: 12px; }
.judge-result.right { color: var(--success); background: #e6f4ea; }
.judge-result.wrong { color: var(--danger); background: #fce8e6; }
.btn { padding: 12px 28px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: var(--card); color: var(--text); border: 2px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-danger { background: var(--danger); color: white; }
.nav-bar { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.sticky-nav {
  position: sticky; top: 0; z-index: 95;
  background: var(--card); padding: 10px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  max-width: 800px; margin: 0 auto;
  display: flex; justify-content: space-between; gap: 12px; align-items: center;
}
.sticky-nav .submit-wrap { display: flex; gap: 12px; }
.score-panel { max-width: 600px; margin: 60px auto; text-align: center; background: var(--card); border-radius: 20px; padding: 48px 32px; box-shadow: var(--shadow); }
.score-circle {
  width: 140px; height: 140px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px; font-size: 42px; font-weight: 800; border: 6px solid;
}
.score-circle.pass { color: var(--success); border-color: var(--success); background: #e6f4ea; }
.score-circle.fail { color: var(--danger); border-color: var(--danger); background: #fce8e6; }
.score-detail { display: flex; justify-content: center; gap: 32px; margin: 24px 0; }
.score-detail-item { text-align: center; }
.score-detail-item .num { font-size: 32px; font-weight: 800; }
.score-detail-item .label { font-size: 14px; color: var(--text-secondary); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.filter-btn {
  padding: 8px 18px; border: 2px solid var(--border); border-radius: 8px;
  background: var(--card); font-size: 14px; cursor: pointer; transition: all 0.15s;
}
.filter-btn.active { border-color: var(--primary); background: #e8f0fe; color: var(--primary); font-weight: 600; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: white; font-size: 15px; cursor: pointer; opacity: 0.9; }
.back-btn:hover { opacity: 1; }
.hidden { display: none !important; }
.empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 60px; margin-bottom: 16px; }
.cheer-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
  z-index: 9999; text-align: center; pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity: 0;
}
.cheer-popup.show { transform: translate(-50%,-50%) scale(1); opacity: 1; }
.cheer-emoji { font-size: 72px; line-height: 1.2; }
.cheer-text {
  font-size: 24px; font-weight: 800; margin-top: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.cheer-popup.right .cheer-text { color: var(--success); }
.cheer-popup.wrong .cheer-text { color: var(--primary); }
.cheer-sub { font-size: 15px; color: var(--text-secondary); margin-top: 4px; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📋 信息安规题库</h1>
    <div class="subtitle">国家电网有限公司电力安全工作规程（第9部分：信息部分）</div>
  </div>
  <button class="back-btn hidden" id="backHome" onclick="goHome()">← 返回首页</button>
</div>

  <div class="cheer-popup" id="cheerPopup"><div class="cheer-emoji" id="cheerEmoji"></div><div class="cheer-text" id="cheerText"></div><div class="cheer-sub" id="cheerSub"></div></div>

<div class="home" id="homePage">
  <div class="home-title">信息安规 · 模拟测试与刷题练习</div>
  <div class="home-desc">共 285 题 · 单选 125 · 多选 60 · 判断 100</div>
  <div class="mode-grid">
    <div class="mode-card" onclick="startExam()">
      <div class="icon">📝</div>
      <h2>模拟测试</h2>
      <p>随机抽取 100 题<br>限时 20 分钟<br>90 分及格<br>交卷后查看详细解析</p>
    </div>
    <div class="mode-card" onclick="startPractice()">
      <div class="icon">📚</div>
      <h2>刷题练习</h2>
      <p>逐题作答<br>即时查看答案与口诀<br>按题型筛选<br>自由翻页</p>
    </div>
    <div class="mode-card" onclick="startWrongPractice()">
      <div class="icon">❌</div>
      <h2>错题练习</h2>
      <p>自动归集答错的题目<br>针对薄弱环节<br>反复巩固</p>

  </div>
  <div class="stats-bar">
    <div class="stat-item"><div class="num">285</div><div class="label">总题数</div></div>
    <div class="stat-item"><div class="num">125</div><div class="label">单选题</div></div>
    <div class="stat-item"><div class="num">60</div><div class="label">多选题</div></div>
    <div class="stat-item"><div class="num">100</div><div class="label">判断题</div></div>
  </div>
</div>

<div class="hidden" id="examPage">
  <div class="exam-header">
    <div class="exam-progress" id="examProgress">第 1 / 100 题</div>
    <div class="exam-timer" id="examTimer">⏱ 20:00</div>
  </div>
  <div class="sticky-nav" id="examStickyNav">
    <button class="btn btn-secondary" id="examPrev" onclick="examPrev()">上一题</button>
    <div class="submit-wrap">
      <button class="btn btn-danger" onclick="submitExam()">交卷</button>
      <button class="btn btn-primary" id="examNext" onclick="examNext()">下一题</button>
    </div>
  </div>
  <div class="question-container" id="examContainer"></div>
</div>

<div class="hidden" id="resultPage">
  <div class="score-panel" id="scorePanel"></div>
  <div style="text-align:center;margin-bottom:40px;">
    <button class="btn btn-secondary" onclick="reviewExam()" style="margin-right:12px;">查看解析</button>
    <button class="btn btn-primary" onclick="startExam()">再考一次</button>
    <button class="btn btn-secondary" onclick="goHome()" style="margin-left:12px;">返回首页</button>
  </div>
</div>

<div class="hidden" id="reviewPage">
  <div class="exam-header">
    <div class="exam-progress" id="reviewProgress">解析 1 / 100</div>
    <div style="font-size:15px;font-weight:600;color:var(--text-secondary);">答题回顾</div>
  </div>
  <div class="sticky-nav" id="reviewStickyNav">
    <button class="btn btn-secondary" id="reviewPrev" onclick="reviewPrev()">上一题</button>
    <button class="btn btn-primary" id="reviewNext" onclick="reviewNext()">下一题</button>
  </div>
  <div class="question-container" id="reviewContainer"></div>
  <div style="text-align:center;margin-bottom:60px;">
    <button class="btn btn-primary" onclick="startExam()">再考一次</button>
    <button class="btn btn-secondary" onclick="goHome()" style="margin-left:12px;">返回首页</button>
  </div>
</div>

<div class="hidden" id="practicePage">
  <div class="exam-header">
    <div class="exam-progress" id="practiceProgress">第 1 题</div>
    <div style="font-size:14px;color:var(--text-secondary);" id="practiceFilter">全部题型</div>
  </div>
  <div class="filter-bar" id="practiceFilters" style="padding-top:16px;">
    <button class="filter-btn active" onclick="filterPractice('all', this)">全部</button>
    <button class="filter-btn" onclick="filterPractice('单选题', this)">单选题</button>
    <button class="filter-btn" onclick="filterPractice('多选题', this)">多选题</button>
    <button class="filter-btn" onclick="filterPractice('判断题', this)">判断题</button>
    <button class="filter-btn" id="wrongFilterBtn" onclick="filterPractice('wrong', this)">错题重练</button>
  </div>
  <div class="sticky-nav" id="practiceStickyNav">
    <button class="btn btn-secondary" id="practicePrev" onclick="practicePrev()">上一题</button>
    <button class="btn btn-primary" id="practiceNext" onclick="practiceNext()">下一题</button>
  </div>
  <div class="question-container" id="practiceContainer"></div>
</div>

<script>
const QUESTIONS = [
  {
    "id": 1,
    "type": "单选题",
    "stem": "根据信息安规规定，办理信息工作票延期手续，应在信息工作票的有效期内，由工作负责人向（ ）提出申请，得到同意后给予办理。",

    "analysis": "",

    "answer": "B",
    "basis": "信息安规5.3.5",
    "analysis": "",

  {

// ===== Wrong Question Storage =====
function getWrongIds() { try { return JSON.parse(localStorage.getItem('wrongQuestions') || '[]'); } catch(e) { return []; } }
function saveWrongIds(ids) { localStorage.setItem('wrongQuestions', JSON.stringify(ids)); }
function addWrongId(id) { let ids = getWrongIds(); if (!ids.includes(id)) { ids.push(id); saveWrongIds(ids); } }
function removeWrongId(id) { saveWrongIds(getWrongIds().filter(x => x !== id)); }
function updateWrongBadge() {
  const ids = getWrongIds(); const badge = document.getElementById('wrongBadge');
  if (ids.length > 0) { badge.textContent = ids.length + ' 错题'; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}

// ===== State =====
let examQuestions = [], examAnswers = {}, examIdx = 0, examTimer = null, examStartTime = 0;
let examDuration = 20 * 60, practiceList = [], practiceIdx = 0, practiceAnswered = {};
let currentFilter = 'all', practiceMode = 'practice', reviewIdx = 0;
let practicePending = {}; // pending multi-select choices: qid -> 'ABC'

// ===== Utility =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function typeBadge(type) {
  const m = {'单选题':'badge-single','多选题':'badge-multi','判断题':'badge-judge'};
  const t = {'单选题':'单选','多选题':'多选','判断题':'判断'};
  return '<span class="q-type-tag '+(m[type]||'')+'">'+(t[type]||type)+'</span>';
}
function formatStem(s) { return s.replace(/（\s*）/g,'<span class="blank">（　　）</span>').replace(/\(\s*\)/g,'<span class="blank">（　　）</span>'); }
function formatAnswerDisplay(q, ans) {
  if (q.type === '判断题') { return ans==='A'?'正确':ans==='B'?'错误':ans; }
  return ans.split('').map(l => { const o=q.options.find(x=>x.label===l); return o?l+'. '+o.text:l; }).join('；');
}
function getExplanation(q) { return q.explanation || ('依据' + (q.basis||'')); }

// ===== Home =====
function goHome() {
  clearInterval(examTimer);
  document.querySelectorAll('#homePage,#examPage,#resultPage,#reviewPage,#practicePage').forEach(el=>el.classList.add('hidden'));
  document.getElementById('homePage').classList.remove('hidden');
  document.getElementById('backHome').classList.add('hidden');
  updateWrongBadge();
}

// ===== Exam =====
function startExam() {
  const singles = shuffle(QUESTIONS.filter(q => q.type === '单选题'));
  const multis = shuffle(QUESTIONS.filter(q => q.type === '多选题'));
  const judges = shuffle(QUESTIONS.filter(q => q.type === '判断题'));
  const targetSingles = 44, targetMultis = 21, targetJudges = 35;
  examQuestions = [
    ...singles.slice(0, targetSingles),
    ...multis.slice(0, targetMultis),
    ...judges.slice(0, targetJudges)
  ].slice(0, 100);
  examAnswers = {}; examIdx = 0; examStartTime = Date.now();
  document.querySelectorAll('#homePage,#resultPage,#reviewPage,#practicePage').forEach(el=>el.classList.add('hidden'));
  document.getElementById('examPage').classList.remove('hidden');
  document.getElementById('backHome').classList.remove('hidden');
  renderExam(); startTimer();
}
function startTimer() {
  clearInterval(examTimer);
  examTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now()-examStartTime)/1000);
    const remaining = examDuration - elapsed;
    if (remaining <= 0) { clearInterval(examTimer); submitExam(); return; }
    const m=Math.floor(remaining/60), s=remaining%60;
    const el=document.getElementById('examTimer');
    el.textContent='⏱ '+m+':'+String(s).padStart(2,'0');
    el.classList.toggle('normal', remaining>=300);
  }, 500);
}
function renderExam() {
  const q=examQuestions[examIdx], total=examQuestions.length;
  document.getElementById('examProgress').textContent='第 '+(examIdx+1)+' / '+total+' 题';
  let h='<div class="question-card"><div class="question-meta"><div class="q-num">'+(examIdx+1)+'</div>'+typeBadge(q.type)+'</div><div class="q-stem">'+formatStem(q.stem)+'</div>';
  if (q.type==='判断题') {
    const ua=examAnswers[examIdx];
    h+='<div class="judge-btns">';
    h+='<div class="judge-btn '+(ua==='A'?'selected':'')+'" onclick="selectJudge('+examIdx+',\'A\')">✓ 正确</div>';
    h+='<div class="judge-btn '+(ua==='B'?'selected':'')+'" onclick="selectJudge('+examIdx+',\'B\')">✗ 错误</div>';
    h+='</div>';
  } else {
    const isM=q.type==='多选题';
    if (isM) h+='<div class="multi-hint">📢 多选题：可选择多个选项</div>';
    h+='<div class="options-list">';
    q.options.forEach(o=>{
      const ua=examAnswers[examIdx]||'', sel=ua.includes(o.label);
      h+='<div class="option-item '+(sel?'selected':'')+'" onclick="selectOption('+examIdx+',\''+o.label+'\','+isM+')"><div class="option-label">'+o.label+'</div><div class="option-text">'+o.text+'</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('examContainer').innerHTML=h;
  document.getElementById('examPrev').disabled=examIdx===0;
  document.getElementById('examNext').textContent=examIdx===total-1?'最后一题':'下一题';
}
function selectOption(idx,label,isMulti) {
  if(!isMulti){examAnswers[idx]=label;}
  else{let c=examAnswers[idx]||'';if(c.includes(label)){c=c.split('').filter(l=>l!==label).join('');}else{c=(c+label).split('').sort().join('');}examAnswers[idx]=c;}
  renderExam();
}
function selectJudge(idx,val){examAnswers[idx]=val;renderExam();}
function examPrev(){if(examIdx>0){examIdx--;renderExam();}}
function examNext(){if(examIdx<examQuestions.length-1){examIdx++;renderExam();}}

function submitExam() {
  clearInterval(examTimer);
  let correct=0;
  examQuestions.forEach((q,i)=>{ if(examAnswers[i]===q.answer){correct++;} else {addWrongId(q.id);} });
  updateWrongBadge();
  const total=examQuestions.length, score=Math.round(correct/total*100), passed=score>=90;
  const elapsed=Math.floor((Date.now()-examStartTime)/1000), m=Math.floor(elapsed/60), s=elapsed%60;
  document.getElementById('examPage').classList.add('hidden');
  document.getElementById('resultPage').classList.remove('hidden');
  document.getElementById('scorePanel').innerHTML=
    '<div class="score-circle '+(passed?'pass':'fail')+'">'+score+'分</div>'+
    '<div style="font-size:20px;font-weight:700;margin-bottom:8px;">'+(passed?'🎉 恭喜通过':'❌ 未通过')+'</div>'+
    '<div style="color:var(--text-secondary);margin-bottom:8px;">通过线：90分</div>'+
    '<div class="score-detail">'+
      '<div class="score-detail-item"><div class="num" style="color:var(--success);">'+correct+'</div><div class="label">答对</div></div>'+
      '<div class="score-detail-item"><div class="num" style="color:var(--danger);">'+(total-correct)+'</div><div class="label">答错</div></div>'+
      '<div class="score-detail-item"><div class="num" style="color:var(--primary);">'+m+':'+String(s).padStart(2,'0')+'</div><div class="label">用时</div></div>'+
    '</div>';
}

// ===== Exam Review =====
function reviewExam(){reviewIdx=0;document.getElementById('resultPage').classList.add('hidden');document.getElementById('reviewPage').classList.remove('hidden');renderReview();}
function renderReview() {
  const q=examQuestions[reviewIdx], total=examQuestions.length;
  document.getElementById('reviewProgress').textContent='解析 '+(reviewIdx+1)+' / '+total;
  const ua=examAnswers[reviewIdx]||'未作答', isC=ua===q.answer;
  let h='<div class="question-card"><div class="question-meta"><div class="q-num">'+(reviewIdx+1)+'</div>'+typeBadge(q.type)+'</div><div class="q-stem">'+formatStem(q.stem)+'</div>';
  if(q.type==='判断题'){
    h+='<div class="judge-btns">';
    h+='<div class="judge-btn '+(q.answer==='A'?'reveal-correct':'')+'" style="'+(q.answer==='A'?'':'opacity:0.4;')+'">✓ 正确</div>';
    h+='<div class="judge-btn '+(q.answer==='B'?'reveal-correct':'')+'" style="'+(q.answer==='B'?'':'opacity:0.4;')+'">✗ 错误</div>';
    h+='</div>';
  } else {
    h+='<div class="options-list">';
    q.options.forEach(o=>{
      const ic=q.answer.includes(o.label), iu=(ua||'').includes(o.label);
      let cls=''; if(ic)cls='correct'; else if(iu)cls='wrong';
      h+='<div class="option-item '+cls+'"><div class="option-label">'+o.label+'</div><div class="option-text">'+o.text+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="answer-panel">'+
    '<div class="judge-result '+(isC?'right':'wrong')+'">'+(isC?'✅ 回答正确':'❌ 回答错误')+'</div>'+
    '<div class="answer-row"><span class="answer-label">你的答案：</span><span class="answer-value" style="color:'+(isC?'var(--success)':'var(--danger)')+';">'+(ua==='未作答'?'未作答':formatAnswerDisplay(q,ua))+'</span></div>'+
    '<div class="answer-row"><span class="answer-label">正确答案：</span><span class="answer-value correct-answer">'+formatAnswerDisplay(q,q.answer)+'</span></div>'+
    '<div class="answer-row"><span class="answer-label">答案解释：</span><span class="answer-value explanation-detail">'+getExplanation(q)+'</span></div>'+
    '<div class="answer-row"><span class="answer-label">速记口诀：</span><span class="answer-value mnemonic">'+q.mnemonic+'</span></div>'+
  '</div></div>';
  document.getElementById('reviewContainer').innerHTML=h;
  document.getElementById('reviewPrev').disabled=reviewIdx===0;
  document.getElementById('reviewNext').textContent=reviewIdx===total-1?'完成':'下一题';
}
function reviewPrev(){if(reviewIdx>0){reviewIdx--;renderReview();}}
function reviewNext(){if(reviewIdx<examQuestions.length-1){reviewIdx++;renderReview();}}

// ===== Practice =====
function startPractice() {
  practiceMode='practice'; currentFilter='all'; practiceList=[...QUESTIONS]; practiceIdx=0; practiceAnswered={};
  document.querySelectorAll('#homePage,#examPage,#resultPage,#reviewPage').forEach(el=>el.classList.add('hidden'));
  document.getElementById('practicePage').classList.remove('hidden');
  document.getElementById('backHome').classList.remove('hidden');
  document.getElementById('practiceFilters').classList.remove('hidden');
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  document.getElementById('practiceFilter').textContent='全部题型';
  renderPractice();
}
function startWrongPractice() {
  practiceMode='wrong';
  const wids=getWrongIds();
  document.querySelectorAll('#homePage,#examPage,#resultPage,#reviewPage').forEach(el=>el.classList.add('hidden'));
  document.getElementById('practicePage').classList.remove('hidden');
  document.getElementById('backHome').classList.remove('hidden');
  document.getElementById('practiceFilters').classList.add('hidden');
  if(wids.length===0){
    document.getElementById('practiceProgress').textContent='暂无题目';
    document.getElementById('practiceFilter').textContent='错题练习';
    document.getElementById('practiceContainer').innerHTML='<div class="empty-state"><div class="icon">🎉</div><div style="font-size:20px;font-weight:700;margin-bottom:8px;">还没有错题</div><div>去做模拟测试或刷题练习，答错的题会自动收集到这里</div></div>';
    return;
  }
  practiceList=QUESTIONS.filter(q=>wids.includes(q.id)); practiceIdx=0; practiceAnswered={};
  document.getElementById('practiceFilter').textContent='错题练习（'+practiceList.length+' 题）';
  renderPractice();
}
function filterPractice(filter,btn){
  currentFilter=filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(filter==='all'){practiceList=[...QUESTIONS];document.getElementById('practiceFilter').textContent='全部题型';}
  else if(filter==='wrong'){const wids=getWrongIds();practiceList=QUESTIONS.filter(q=>wids.includes(q.id));document.getElementById('practiceFilter').textContent='错题重练（'+practiceList.length+' 题）';}
  else{practiceList=QUESTIONS.filter(q=>q.type===filter);document.getElementById('practiceFilter').textContent=filter;}
  practiceIdx=0;
  if(practiceList.length===0){
    document.getElementById('practiceContainer').innerHTML='<div class="question-card" style="text-align:center;color:var(--text-secondary);">暂无题目</div>';
    document.getElementById('practiceProgress').textContent='无题目';
  } else { renderPractice(); }
}
function renderPractice() {
  if(practiceList.length===0) return;
  const q=practiceList[practiceIdx], total=practiceList.length;
  document.getElementById('practiceProgress').textContent='第 '+(practiceIdx+1)+' / '+total+' 题';
  const answered=practiceAnswered[q.id], showR=answered!==undefined, isC=answered===q.answer;
  const isM=q.type==='多选题';
  const pending=practicePending[q.id]||'';
  let h='<div class="question-card"><div class="question-meta"><div class="q-num">'+(practiceIdx+1)+'</div>'+typeBadge(q.type)+'</div><div class="q-stem">'+formatStem(q.stem)+'</div>';
  if(q.type==='判断题'){
    h+='<div class="judge-btns">';
    let cA='',cB='';
    if(showR){if(q.answer==='A')cA='reveal-correct';else if(answered==='A')cA='wrong';if(q.answer==='B')cB='reveal-correct';else if(answered==='B')cB='wrong';}
    h+='<div class="judge-btn '+cA+'" onclick="practiceJudge('+q.id+',\'A\')">✓ 正确</div>';
    h+='<div class="judge-btn '+cB+'" onclick="practiceJudge('+q.id+',\'B\')">✗ 错误</div>';
    h+='</div>';
  } else if(isM){
    if(!showR) h+='<div class="multi-hint">📢 多选题：可选择多个选项，选完后点击「确认答案」</div>';
    h+='<div class="options-list">';
    q.options.forEach(o=>{
      let cls='';
      if(showR){const ic=q.answer.includes(o.label),iu=(answered||'').includes(o.label);if(ic)cls='correct';else if(iu)cls='wrong';}
      else if(pending.includes(o.label))cls='selected';
      const oc=showR?'':'onclick="practiceToggle('+q.id+',\''+o.label+'\')"';
      h+='<div class="option-item '+cls+'" '+oc+'><div class="option-label">'+o.label+'</div><div class="option-text">'+o.text+'</div></div>';
    });
    h+='</div>';
    if(!showR){
      h+='<div style="margin-top:16px;text-align:center;">';
      h+='<button class="btn btn-primary" '+(pending.length<2?'disabled':'')+' onclick="practiceConfirm('+q.id+')">确认答案</button>';
      h+='</div>';
    }
  } else {
    h+='<div class="options-list">';
    q.options.forEach(o=>{
      let cls='';
      if(showR){const ic=q.answer.includes(o.label),iu=(answered||'').includes(o.label);if(ic)cls='correct';else if(iu)cls='wrong';}
      const oc=showR?'':'onclick="practiceSingleSelect('+q.id+',\''+o.label+'\')"';
      h+='<div class="option-item '+cls+'" '+oc+'><div class="option-label">'+o.label+'</div><div class="option-text">'+o.text+'</div></div>';
    });
    h+='</div>';
  }
  if(showR){
    if(isC)removeWrongId(q.id); else addWrongId(q.id);
    h+='<div class="answer-panel">'+
      '<div class="judge-result '+(isC?'right':'wrong')+'">'+(isC?'✅ 回答正确':'❌ 回答错误')+'</div>'+
      '<div class="answer-row"><span class="answer-label">正确答案：</span><span class="answer-value correct-answer">'+formatAnswerDisplay(q,q.answer)+'</span></div>'+
      '<div class="answer-row"><span class="answer-label">答案解释：</span><span class="answer-value explanation-detail">'+getExplanation(q)+'</span></div>'+
      '<div class="answer-row"><span class="answer-label">速记口诀：</span><span class="answer-value mnemonic">'+q.mnemonic+'</span></div>'+
    '</div>';
  }
  h+='</div>';
  document.getElementById('practiceContainer').innerHTML=h;
  document.getElementById('practicePrev').disabled=practiceIdx===0;
  document.getElementById('practiceNext').textContent=practiceIdx===total-1?'完成':'下一题';
}
function practiceToggle(qid,label){
  let c=practicePending[qid]||'';
  if(c.includes(label)){c=c.split('').filter(l=>l!==label).join('');}
  else{c=(c+label).split('').sort().join('');}
  practicePending[qid]=c;
  renderPractice();
}
function practiceConfirm(qid){
  const pending=practicePending[qid]||'';
  if(pending.length<2)return;
  const q=practiceList[practiceIdx];
  practiceAnswered[qid]=pending;
  renderPractice();
  showCheer(pending===q.answer);
}
function practiceSingleSelect(qid,label){
  const q=practiceList[practiceIdx];
  practiceAnswered[qid]=label;
  renderPractice();
  showCheer(label===q.answer);
}
function practiceJudge(qid,val){
  const q=practiceList[practiceIdx];
  practiceAnswered[qid]=val;
  renderPractice();
  showCheer(val===q.answer);
}
function practicePrev(){if(practiceIdx>0){practiceIdx--;renderPractice();}}
function practiceNext(){if(practiceIdx<practiceList.length-1){practiceIdx++;renderPractice();}}

// Clear stale wrong questions from the bug where multi-select was auto-judging
localStorage.setItem('wrongQuestions', '[]');

// ===== Cheer System =====
const NAME = '熊杰';
const CHEERS_RIGHT = [
  { emoji: '👍', text: '厉害！', sub: NAME + '，这题稳稳拿下' },
  { emoji: '🎯', text: '可以啊！', sub: NAME + '，思路完全正确' },
  { emoji: '⭐', text: '太棒啦！', sub: NAME + '，知识点掌握得很扎实' },
  { emoji: '✨', text: '优秀！', sub: NAME + '，又拿下一题，继续保持' },
  { emoji: '🚀', text: '漂亮！', sub: NAME + '，这道直接通关' },
  { emoji: '👏', text: '不错不错！', sub: NAME + '，看得出来认真思考了' },
];
const CHEERS_WRONG = [
  { emoji: '💪', text: '没关系！', sub: NAME + '，这次踩坑了，记住这个点下次就不会错啦' },
  { emoji: '📖', text: '没事！', sub: NAME + '，错题正是查漏补缺的好机会，再看一眼解析～' },
  { emoji: '🤔', text: '小小的失误', sub: NAME + '，弄懂原理，下一题一定没问题' },
  { emoji: '🌱', text: '别灰心！', sub: NAME + '，学习本来就是不断试错的过程，加油' },
  { emoji: '💡', text: '这题有点绕哦', sub: NAME + '，看完解析，下次轻松搞定' },
  { emoji: '📝', text: '一次答错不算什么', sub: NAME + '，复盘一下，收获反而更大💪' },
];
function showCheer(isRight) {
  const pool = isRight ? CHEERS_RIGHT : CHEERS_WRONG;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const popup = document.getElementById('cheerPopup');
  popup.className = 'cheer-popup ' + (isRight ? 'right' : 'wrong');
  document.getElementById('cheerEmoji').textContent = pick.emoji;
  document.getElementById('cheerText').textContent = pick.text;
  document.getElementById('cheerSub').textContent = pick.sub;
  popup.classList.add('show');
  clearTimeout(window._cheerTimer);
  window._cheerTimer = setTimeout(() => { popup.classList.remove('show'); }, 1400);
}

updateWrongBadge();
</script>
